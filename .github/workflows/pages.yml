# 把 demo 部署到 GitHub Pages：https://uxieverity.github.io/fanhua/
# push 到 main 自动跑；产物只在 CI 里拼装，不进版本库。
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # 站点布局与仓库不同（demo/index.html 提到根），所以把 ../ 前缀改成 ./
      # 本地 demo/index.html 不受影响，照旧从仓库根相对取 ../dist、../img
      - name: Stage site
        run: |
          mkdir -p site/dist site/img
          sed 's|\.\./dist/|./dist/|g; s|\.\./img/|./img/|g' demo/index.html > site/index.html
          cp dist/fanhua.iife.js site/dist/
          cp -r img/flowers site/img/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
